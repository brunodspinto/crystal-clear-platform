595">according to the AssetType.</text></g><g class="entity" data-qualified-name="GMN47" data-source-line="127" id="ent0048"><path d="M1129.48,6 L1129.48,98.87 L1095.11,102.87 L1129.48,106.87 L1129.48,199.7266 A0,0 0 0 0 1129.48,199.7266 L1526.2168,199.7266 A0,0 0 0 0 1526.2168,199.7266 L1526.2168,16 L1516.2168,6 L1129.48,6 A0,0 0 0 0 1129.48,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1516.2168,6 L1516.2168,16 L1526.2168,16 L1516.2168,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.4189" x="1135.48" y="23.5684">getAssetsAt validates inputs:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.7256" x="1135.48" y="38.8789">throws IllegalArgumentException if agent or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.9028" x="1135.48" y="54.1895">referenceDate is null. Then iterates the validated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.9292" x="1135.48" y="69.5">declarations and collects each AssetEntry.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1135.48" y="84.8105">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.0083" x="1135.48" y="100.1211">AC4: isCurrentUserJournalist() returns true when the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.3276" x="1135.48" y="115.4316">current UserSession is logged in and has a role</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.4756" x="1135.48" y="130.7422">whose description equals "JOURNALIST"; the UI uses</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.4312" x="1135.48" y="146.0527">the boolean to decide whether to mask sensitive values.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="357.8491" x="1135.48" y="161.3633">The comparison uses the role description string because</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.7368" x="1135.48" y="176.6738">the AuthLib exposes roles as UserRoleDTO (id/description),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.394" x="1135.48" y="191.9844">so the description is the only stable identifier available.</text></g><g class="entity" data-qualified-name="GMN50" data-source-line="142" id="ent0051"><path d="M1218.4,647.78 L1218.4,703.7116 A0,0 0 0 0 1218.4,703.7116 L1457.2896,703.7116 A0,0 0 0 0 1457.2896,703.7116 L1457.2896,657.78 L1447.2896,647.78 L1341.85,647.78 L1337.85,542.19 L1333.85,647.78 L1218.4,647.78 A0,0 0 0 0 1218.4,647.78" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1447.2896,647.78 L1447.2896,657.78 L1457.2896,657.78 L1447.2896,647.78" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.5659" x="1224.4" y="665.3484">AC2: returns only declarations</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.002" x="1224.4" y="680.6589">with status = VALIDATED and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8896" x="1224.4" y="695.9695">submissionDate &lt;= referenceDate</text></g><!--link ConsultAssetsUI to ConsultAssetsController--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="89" id="lnk17"><path codeLine="89" d="M469.95,102.87 C515.65,102.87 566.52,102.87 566.52,