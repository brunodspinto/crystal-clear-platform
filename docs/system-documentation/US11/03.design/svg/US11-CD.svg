6.62" y="84.8105">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.0083" x="936.62" y="100.1211">AC4: isCurrentUserJournalist() returns true when the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.3276" x="936.62" y="115.4316">current UserSession is logged in and has a role</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.3018" x="936.62" y="130.7422">whose description equals "Journalist"; the UI uses</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.4312" x="936.62" y="146.0527">the boolean to decide whether to mask sensitive values.</text></g><g class="entity" data-qualified-name="GMN47" data-source-line="133" id="ent0048"><path d="M1002.39,601.84 L1002.39,657.7716 A0,0 0 0 0 1002.39,657.7716 L1241.2796,657.7716 A0,0 0 0 0 1241.2796,657.7716 L1241.2796,611.84 L1231.2796,601.84 L1125.84,601.84 L1121.84,496.25 L1117.84,601.84 L1002.39,601.84 A0,0 0 0 0 1002.39,601.84" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1231.2796,601.84 L1231.2796,611.84 L1241.2796,611.84 L1231.2796,601.84" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.5659" x="1008.39" y="619.4084">AC2: returns only declarations</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.002" x="1008.39" y="634.7189">with status = VALIDATED and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8896" x="1008.39" y="650.0295">submissionDate &lt;= referenceDate</text></g><!--link ConsultAssetsUI to ConsultAssetsController--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="89" id="lnk17">