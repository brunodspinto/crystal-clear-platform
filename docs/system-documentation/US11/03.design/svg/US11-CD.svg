dth:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.5249" x="1323.05" y="23.5684">getAssetsAt validates inputs (throws</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.5693" x="1323.05" y="38.8789">IllegalArgumentException if agentDto or referenceDate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.6294" x="1323.05" y="54.1895">is null), resolves the agent by email via getByEmail,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.7271" x="1323.05" y="69.5">iterates the validated declarations collecting each</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.6025" x="1323.05" y="84.8105">AssetEntry, and returns DTOs built by the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.2588" x="1323.05" y="100.1211">AssetEntryMapper (DTO pattern). The mapper marks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.5698" x="1323.05" y="115.4316">vehicle/stock details as sensitive so the UI can</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.2373" x="1323.05" y="130.7422">mask them for non-journalists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1323.05" y="146.0527">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.0083" x="1323.05" y="161.3633">AC4: isCurrentUserJournalist() returns true when the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.3276" x="1323.05" y="176.6738">current UserSession is logged in and has a role</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.4756" x="1323.05" y="191.9844">whose description equals "JOURNALIST"; the UI uses</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.4312" x="1323.05" y="207.2949">the boolean to decide whether to mask sensitive values.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="357.8491" x="1323.05" y="222.6055">The comparison uses the role description string because</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.7368" x="1323.05" y="237.916">the AuthLib exposes roles as UserRoleDTO (id/description),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.394" x="1323.05" y="253.2266">so the description is the only stable identifier available.</text></g><g class="entity" data-qualified-name="GMN57" data-source-line="173" id="ent0058"><path d="M1010.97,758.48 L1010.97,814.4116 A0,0 0 0 0 1010.97,814.4116 L1249.8596,814.4116 A0,0 0 0 0 1249.8596,814.4116 L1249.8596,768.48 L1239.8596,758.48 L1161.85,758.48 L1287.78,628.12 L1153.85,758.48 L1010.97,758.48 A0,0 0 0 0 1010.97,758.48" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1239.8596,758.48 L1239.8596,768.48 L1249.8596,768.48 L1239.8596,758.48" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.5659" x="1016.97" y="776.0484">AC2: returns only declarations</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.002" x="1016.97" y="791.3589">with status = VALIDATED and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8896" x="1016.97" y="806.6695">submissionDate &lt;= referenceDate</text></g><!--link Cons